    Choose a gamemode to import the official default challenges (5 levels, 57 challenges) into:
    §cThis will wipe that gamemode's existing challenge data and cannot be undone.
  confirm-title: ⚠ Confirm Import
  confirm-content: |-
    This will completely wipe {gamemode}'s existing challenge data and replace it with the official default challenge set (5 levels, 57 challenges).

